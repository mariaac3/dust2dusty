### FILE LOCATIONS ###
# DATA_INPUT is the SALT2mu file that will be used as 'data'.
# This can either be real data or a realistic simulation with the appropriate force_realdata flag
# Full filepath or local directory is fine.
#
# SIM_INPUT is the SALT2mu file that points to appropriate bounded functions to be reweighted.
# Alternatively, this can be used with NOWEIGHT option for a non-bounded function.
# Full filepath or local directory is fine
#
# OUTDIR is a custom directory to output results to, including log files.
# Full filepath needed for this one.
#
# CHAINS is a filepath to the npz file containing the chain output from a previous run.
#
# SIMREF_FILE - if using bounding functions, point to the SNANA input that contains these bounding functions.

DATA_INPUT: /project2/rkessler/SURVEYS/DEBASS/USERS/mariaace/DR1/d2d_upgrades/SALT2mu_ALL_DATA.input
SIM_INPUT: /project2/rkessler/SURVEYS/DEBASS/USERS/mariaace/DR1/d2d_upgrades/SALT2mu_ALL_BOUND.input
OUTDIR: /project2/rkessler/SURVEYS/DEBASS/USERS/mariaace/DR1/d2d_upgrades/des_d2d_rerun_outputs/
SIMREF_FILE: /scratch/midway2/rkessler/PIPPIN_OUTPUT/BP-DES5YR-DUST2DUST/1_SIM/DES_DUST2DUST/PIP_BP-DES5YR-DUST2DUST_DES_DUST2DUST.input

### INPUT OPTIONS ###
FITTED_PARAMS:
    c:
        dist: Gaussian
    RV:
        dist: Gaussian
        splits:
            HOST_LOGMASS: 10
    EBV:
        dist: Exponential
        splits:
            SIM_ZCMB: 0.1
            HOST_LOGMASS: 10
    beta:
        dist: Gaussian #The parameters to be fitted.

PARAMETER_INITS:
    c_mu:
        p0: -0.077
        p0_std: 0.01
        bounds: [-0.3, -0.04]
    c_std:
        p0: 0.058
        p0_std: 0.01
        bounds: [0.01, 0.2]
    RV_mu_HOST_LOGMASS_low:
        p0: 3.026
        p0_std: 0.38
        bounds: [0.8, 4]
    RV_mu_HOST_LOGMASS_high:
        p0: 2.138
        p0_std: 0.25
        bounds: [0.8, 4]
    RV_std_HOST_LOGMASS_low:
        p0: 1.481
        p0_std: 0.42
        bounds: [0.25, 4]
    RV_std_HOST_LOGMASS_high:
        p0: 1.06
        p0_std: 0.43
        bounds: [0.25, 4]
    EBV_tau_SIM_ZCMB_low_HOST_LOGMASS_low:
        p0: 0.09
        p0_std: 0.02
        bounds: [0.05, 0.2]
    EBV_tau_SIM_ZCMB_low_HOST_LOGMASS_high:
        p0: 0.11
        p0_std: 0.02
        bounds: [0.05, 0.2]
    EBV_tau_SIM_ZCMB_high_HOST_LOGMASS_low:
        p0: 0.07
        p0_std: 0.02
        bounds: [0.05, 0.2]
    EBV_tau_SIM_ZCMB_high_HOST_LOGMASS_high:
        p0: 0.05
        p0_std: 0.02
        bounds: [0.05, 0.2]
    beta_mu:
        p0: 2.064
        p0_std: 0.17
        bounds: [1, 3]
    beta_std:
        p0: 0.308
        p0_std: 0.08
        bounds: [0, 1]

# SPLITARR is the array to generate over for multi dimensional GENPDFS.
# method: arange (evenly spaced by step) or linspace (evenly spaced by count)
# args: [p0, stop, step_or_count]
SALT2MU_GENDPDF_GRID:
    HOST_LOGMASS:
        method: arange
        args: [5, 15, 1]
    SIM_ZCMB:
        method: linspace
        args: [-2.4, 2.6, 3]

### DEFAULTS ###
# Right now the dictionary entries are made by hand, and need to match any split options.
#PARAMETER_INITIALIZATION: Contains walker and boundary information. Walkers are initialised in Gaussian spread
#First Entry is the mean p0ing location for the walker
#Second Entry is the p0_std of p0ing locations for the walker
#Third Entry is whether or not the mean value of the walker needs to be true (eg for p0_stds)
#Fourth Entry is [lower_bound, upper_bound] for the parameter
